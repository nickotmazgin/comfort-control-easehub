name: Validate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-bin jq rsync unzip zip gjs
      - name: Validate metadata.json
        run: |
          jq . metadata.json > /dev/null
      - name: Compile GSettings schemas
        run: |
          if [ -d schemas ]; then glib-compile-schemas schemas; fi
      - name: Test the Files right-click menu writer
        run: gjs -m tools/tests/files-menu.test.js "$(mktemp -d)/scripts" "$PWD"
      - name: Check helper script syntax
        run: |
          for f in scripts/*.sh tools/*.sh *.sh; do bash -n "$f"; done
      - name: Build and validate release zip
        run: |
          ./create-release-zips.sh
          RANGE=$(jq -r '.["shell-version"] | "\(first)-\(last)"' metadata.json)
          ZIP="dist/comfort-control@nickotmazgin-${RANGE}.shell-extension.zip"
          test -f "$ZIP"
          for f in extension.js prefs.js metadata.json stylesheet.css \
                   schemas/org.gnome.shell.extensions.easehub.gschema.xml \
                   scripts/easehub-reload-shell.sh scripts/easehub-sudo-extend.sh \
                   scripts/easehub-files.sh icons/easehub-symbolic.svg lib/filesMenu.js; do
            unzip -Z1 "$ZIP" | grep -qx "$f" || { echo "missing in zip: $f"; exit 1; }
          done
          ! unzip -Z1 "$ZIP" | grep -qx schemas/gschemas.compiled
          test "$(unzip -p "$ZIP" metadata.json | jq -c '.["shell-version"]')" = "$(jq -c '.["shell-version"]' metadata.json)"
          test "$(unzip -p "$ZIP" metadata.json | jq -r '.["version-name"]')" = "$(jq -r '.["version-name"]' metadata.json)"
          test "$(unzip -p "$ZIP" scripts/easehub-reload-shell.sh | head -1)" = "#!/usr/bin/env bash"
          test "$(unzip -p "$ZIP" scripts/easehub-sudo-extend.sh | head -1)" = "#!/usr/bin/env bash"
      - name: CHANGELOG has an entry for this version
        run: |
          VERSION=$(jq -r '.["version-name"] | split(" ")[0]' metadata.json)
          grep -q "^## ${VERSION} " CHANGELOG.md || { echo "CHANGELOG.md has no '## ${VERSION}' entry"; exit 1; }
